spring:
    application:
        name: gold_stack
    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: true
    flyway:
        enabled: true

    ai:
        openai:
          api-key: ${OPENAI_API_KEY}
          chat:
            options:
                model: gpt-4o-mini

        vectorstore:
            pgvector:
                initialize-schema: true

management:
    endpoints:
        web:
            exposure:
                include: health,metrics,prometheus
server:
    port: 8080

app:
    seed:
        enabled: true
